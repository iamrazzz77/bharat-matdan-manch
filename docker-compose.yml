version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bmm_postgres
    restart: always
    environment:
      POSTGRES_USER: eci_admin
      POSTGRES_PASSWORD: eci_secure_password_2026
      POSTGRES_DB: voting_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bmm_redis
    restart: always
    ports:
      - "6379:6379"

  nextjs_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bmm_nextjs_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://eci_admin:eci_secure_password_2026@postgres:5432/voting_db?schema=public"
      JWT_SECRET: "bharat_matdan_secret_key_2026_super_secure_sha256"
      NODE_ENV: "production"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
